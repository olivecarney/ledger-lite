spring.application.name=LedgerLite
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_lite}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledger}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
